name: transwell
description: TransWell - transport commission agent app (trips, hisaab, bilty, load board, tracking).
publish_to: 'none'
version: 0.3.1+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  url_launcher: ^6.3.0
  geolocator: '>=13.0.0 <15.0.0'
  image_picker: ^1.1.2
  pdf: ^3.11.0
  printing: ^5.13.0
  flutter_map: '>=7.0.0 <9.0.0'
  latlong2: ^0.9.1
  flutter_contacts: ^1.1.9
  file_picker: '>=8.1.2 <11.0.0'
  excel: ^4.0.6
  share_plus: '>=10.1.0 <12.0.0'

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon_full.png"
  adaptive_icon_background: "#0B2A6B"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21
