name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (first time only)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.spywell --project-name transwell .
            rm -rf test
          fi
          # App name, internet / location permissions, call + WhatsApp intents
          python3 tool/patch_android.py android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk TransWell-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TransWell-apk
          path: TransWell-v${{ github.run_number }}.apk
          retention-days: 30

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: TransWell v0.2.${{ github.run_number }}
          body: |
            Phone pe niche wali **TransWell-v${{ github.run_number }}.apk** file download karke install karo.
            (Pehli baar "Unknown apps install" ki permission maangega — allow kar do.)
          files: TransWell-v${{ github.run_number }}.apk
          make_latest: true
